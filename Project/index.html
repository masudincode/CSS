<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" href="./Assets/logo.png">
    <title>Spotify - web Player: Music For Everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <div class="sidebar">
            <div class="nav">
                <div class="nav-option" style="opacity: 1;">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Home</a>
                </div>
                <div class="nav-option">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <a href="#">Search</a>
                </div>
            </div>
            <div class="library">
                <div class="options">
                    <div class="lib-options nav-option">
                     <img src="Assets/library_icon.png">
                     <a href="#">Your Library</a>
                    </div>
                    <div class="icons">
                        <i class="fa-solid fa-plus"></i>
                        <i class="fa-solid fa-arrow-right"></i>
                    </div>
                </div>
                <div class="lib-boxs">
                    <div class="box">
                        <p class="box-p1">Create your first playlist</p><br>
                        <p class="box-p2">It's easy, we'll help you</p><br>
                        <button class="badge" style="color: black;">Create playlist</button>
                    </div>
                     <div class="box">
                        <p class="box-p1">Let's find some podcast to follow</p><br>
                        <p class="box-p2">We'll keep you updated on new episodes</p><br>
                        <button class="badge" style="color: black;">Browse podcast</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="sticky-nav">
                <div class="sticky-nav-icons">
                   <img src="Assets/backward_icon.png">
                   <img src="Assets/forward_icon.png" >
                </div>
                <div class="sticky-nav-options">
                   <button class="badge nav-item" style="color: black;">Explore Premium</button>
                   <button class="badge nav-item dark-badge"><i class="fa-regular fa-circle-down" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; margin-right: 5px;"></i>Install App</button>
                   <i class="fa-regular fa-user nav-item"></i>
                </div>
            </div>
            <div class="cards"></div>
        </div>
        <div class="music-player"> music player</div>
    </div>
</body>
</html>
